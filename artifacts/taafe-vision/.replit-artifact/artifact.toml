kind = "web"
previewPath = "/"
title = "Taafé Vision"
description = "Le site officiel de Taafé Vision, association burkinabè qui utilise le cinéma pour promouvoir les droits des femmes, soutenir les réalisatrices et sensibiliser les communautés."
version = "1.0.0"
id = "artifacts/taafe-vision"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20053

[services.development]
run = "pnpm --filter @workspace/taafe-vision run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/taafe-vision", "run", "build" ]
serve = "static"
publicDir = "artifacts/taafe-vision/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20053"
BASE_PATH = "/"
